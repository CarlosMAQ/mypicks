<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Picks</title>
<style>
:root{--bg:#0e1117;--card:#171b24;--card2:#11151d;--line:#262c3a;--txt:#e8ebf2;--muted:#8a93a6;--acc:#3b82f6;--ok:#2fbf71;--warn:#f2b136;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px;max-width:720px;margin:0 auto}
header h1{font-size:20px}
h3{font-size:17px}
.muted{color:var(--muted);font-size:12px;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.btn{background:#232a38;color:var(--txt);border:1px solid #303849;border-radius:10px;font-weight:700;font-size:14px;padding:9px 12px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--acc);border-color:var(--acc)}
.btn.g{background:#1f3a2c;border-color:#2c5a41}
.btn.r{background:#3a2323;border-color:#5a2c2c}
.btn.s{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.team{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.team img{width:38px;height:38px;object-fit:contain}
.big{font-size:32px;font-weight:800;white-space:nowrap}
.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.lbl{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:15px;font-family:inherit}
input.ln{width:84px;text-align:center}
.st{font-weight:700;font-size:14px;margin-top:6px}
.won{color:var(--ok)}.lost{color:var(--bad)}.live{color:var(--warn)}.pending{color:var(--muted)}.push{color:#9aa4ff}
.pick{background:var(--card2);border-radius:12px;padding:10px;margin-top:8px;border-left:4px solid var(--line)}
.pick.won{border-left-color:var(--ok)}.pick.lost{border-left-color:var(--bad)}.pick.live{border-left-color:var(--warn)}
.val{font-size:26px;font-weight:800;color:var(--txt)}
.bar{height:6px;background:#0b0e13;border-radius:99px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--warn)}
.bar div.ok{background:var(--ok)}.bar div.bad{background:var(--bad)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0b0e13;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:8px 0 10px;font-size:12px;font-weight:600;cursor:pointer}
nav.tabs button b{display:block;font-size:20px}
nav.tabs button.on{color:var(--txt)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sug{max-height:260px;overflow:auto;margin-top:6px;border-radius:10px}
.sug div{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.sug div:hover{background:var(--card2)}
.ev{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer}
.ev:hover{background:var(--card2)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
.toast{background:#232a38;border:1px solid #3a4459;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.4)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--card2);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;margin-top:2px;color:var(--txt)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.leg{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg:last-child{border-bottom:none}
label.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
label.chk input{width:20px;height:20px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div><h1>🎯 Mis Picks</h1><div class="muted" id="upd">—</div></div>
  <div class="row"><span id="syncBadge" class="muted"></span><button class="btn s" onclick="A.refresh()">⟳</button></div>
</header>
<div class="wrap" id="view"></div>
<nav class="tabs">
  <button data-tab="games" onclick="A.tab('games')"><b>🏟️</b>Partidos</button>
  <button data-tab="tickets" onclick="A.tab('tickets')"><b>🎟️</b>Boletos</button>
  <button data-tab="history" onclick="A.tab('history')"><b>📈</b>Historial</button>
  <button data-tab="settings" onclick="A.tab('settings')"><b>⚙️</b>Ajustes</button>
</nav>
<div id="modal" onclick="if(event.target===this)A.close()"><div id="sheet"></div></div>
<div id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="A.importFile(this)">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyA8e4gXilVUBatLGo0wEKFxq5bXPwiHq5M",
  authDomain: "mypicks-5fbb7.firebaseapp.com",
  projectId: "mypicks-5fbb7",
  storageBucket: "mypicks-5fbb7.firebasestorage.app",
  messagingSenderId: "987308001917",
  appId: "1:987308001917:web:2aa8a94be741a8d1c17f14"
};
// ==================================================

const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const API_WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/';
const LEAGUES = {
  nfl:  {name:'NFL',       path:'football/nfl',              type:'fb'},
  nba:  {name:'NBA',       path:'basketball/nba',            type:'nba'},
  ncaa: {name:'NCAA',      path:'football/college-football', type:'fb', extra:'&groups=80'},
  mx:   {name:'Liga MX',   path:'soccer/mex.1',              type:'soc'},
  ucl:  {name:'Champions', path:'soccer/uefa.champions',     type:'soc'},
  esp:  {name:'La Liga',   path:'soccer/esp.1',              type:'soc'},
  mlb:  {name:'MLB',       path:'baseball/mlb',              type:'mlb'}
};
const UNIT = {fb:'pts', nba:'pts', soc:'goles', mlb:'carreras'};
const SCORE_BTNS = {fb:[1,2,3,6], nba:[1,2,3], soc:[1], mlb:[1]};
const GROUPS = ['passing','rushing','receiving','batting','pitching'];

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = n => n == null || isNaN(n) ? '—' : (Number.isInteger(+n) ? String(+n) : (+n).toFixed(1));
const money = n => '$' + (+n || 0).toLocaleString('es-MX', {maximumFractionDigits: 2});
const signed = n => n == null ? '' : (n > 0 ? '+' + fmt(n) : fmt(n));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const num = x => { if (x == null) return null; const s = String(x).trim().replace(/,/g, ''); if (s === '' || s === '--') return null; const n = Number(s); return isNaN(n) ? null : n; };
const v = (m, ...ks) => { if (!m) return null; for (const k of ks) { const x = m[k]; if (x != null && !isNaN(x)) return +x; } return null; };
const sum = (...xs) => xs.some(x => x != null) ? xs.reduce((a, x) => a + (x || 0), 0) : null;
const amToDec = o => { o = +o; if (!o) return 1; if (o >= 100) return 1 + o / 100; if (o <= -100) return 1 + 100 / -o; return o > 1 ? o : 1; };
const parseOdds = s => num(String(s || '').replace('+', ''));
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }

// ---------- propuestas por deporte ----------
const TD   = m => sum(v(m,'rushing.rushingTouchdowns','rushingTouchdowns'), v(m,'receiving.receivingTouchdowns','receivingTouchdowns'));
const PY   = m => v(m,'passing.passingYards','passingYards');
const RY   = m => v(m,'rushing.rushingYards','rushingYards');
const REC  = m => v(m,'receiving.receptions','receptions');
const RECY = m => v(m,'receiving.receivingYards','receivingYards');
const GOL  = m => v(m,'totalGoals');
const BH   = m => v(m,'batting.hits','batting.H');
const BR   = m => v(m,'batting.runs','batting.R');
const BRBI = m => v(m,'batting.RBIs','batting.RBI');
const OUTS = m => { const ip = v(m,'pitching.fullInnings.partInnings','pitching.innings','pitching.IP'); return ip == null ? null : Math.floor(ip) * 3 + Math.round((ip % 1) * 10); };
const PITCHERS = ['SP','RP','P'];
const PTS = m => v(m,'points','PTS');
const REB = m => v(m,'rebounds','totalRebounds','REB');
const AST = m => v(m,'assists','AST');
const STL = m => v(m,'steals','STL');
const BLK = m => v(m,'blocks','BLK');
const DD = n => m => { const xs = [PTS(m),REB(m),AST(m),STL(m),BLK(m)]; if (xs.every(x => x == null)) return null; return xs.filter(x => (x || 0) >= 10).length >= n ? 1 : 0; };

const POS = {
  nba: [
    {id:'JUG', name:'Jugador', filter:null, props:[
      {id:'pts', name:'Puntos', get:PTS},
      {id:'reb', name:'Rebotes', get:REB},
      {id:'ast', name:'Asistencias', get:AST},
      {id:'3pm', name:'Triples anotados', get:m=>v(m,'threePointFieldGoalsMade','3PM')},
      {id:'pra', name:'Puntos + rebotes + asistencias', get:m=>sum(PTS(m),REB(m),AST(m))},
      {id:'pr',  name:'Puntos + rebotes', get:m=>sum(PTS(m),REB(m))},
      {id:'pa',  name:'Puntos + asistencias', get:m=>sum(PTS(m),AST(m))},
      {id:'ra',  name:'Rebotes + asistencias', get:m=>sum(REB(m),AST(m))},
      {id:'stl', name:'Robos', get:STL},
      {id:'blk', name:'Tapones', get:BLK},
      {id:'sb',  name:'Robos + tapones', get:m=>sum(STL(m),BLK(m))},
      {id:'to',  name:'Pérdidas de balón', get:m=>v(m,'turnovers','TO')},
      {id:'ftm', name:'Tiros libres anotados', get:m=>v(m,'freeThrowsMade','FTM')},
      {id:'dd',  name:'Doble-doble', yes:1, get:DD(2)},
      {id:'td',  name:'Triple-doble', yes:1, get:DD(3)}
    ]}
  ],
  fb: [
    {id:'QB', name:'QB', filter:['QB'], props:[
      {id:'py',  name:'Yardas por pase', get:PY},
      {id:'cmp', name:'Pases completos', get:m=>v(m,'passing.completions','completions')},
      {id:'att', name:'Intentos de pase', get:m=>v(m,'passing.passingAttempts','passingAttempts')},
      {id:'ptd', name:'TD por pase', get:m=>v(m,'passing.passingTouchdowns','passingTouchdowns')},
      {id:'int', name:'Intercepciones', get:m=>v(m,'passing.interceptions','interceptions')},
      {id:'ry',  name:'Yardas por tierra', get:RY},
      {id:'pry', name:'Yardas pase + tierra', get:m=>sum(PY(m),RY(m))},
      {id:'lp',  name:'Pase más largo (manual)', get:null},
      {id:'td',  name:'Anota TD', yes:1, get:TD}
    ]},
    {id:'RB', name:'Corredor (RB)', filter:['RB','FB'], props:[
      {id:'ry',   name:'Yardas por tierra', get:RY},
      {id:'car',  name:'Acarreos', get:m=>v(m,'rushing.rushingAttempts','rushingAttempts')},
      {id:'lr',   name:'Carrera más larga', get:m=>v(m,'rushing.longRushing','longRushing')},
      {id:'rec',  name:'Recepciones', get:REC},
      {id:'recy', name:'Yardas por recepción', get:RECY},
      {id:'tot',  name:'Yardas totales (tierra + recepción)', get:m=>sum(RY(m),RECY(m))},
      {id:'td',   name:'Anota TD', yes:1, get:TD},
      {id:'td2',  name:'2+ TD', yes:2, get:TD},
      {id:'ftd',  name:'Primer TD del partido (manual)', yes:1, get:null},
      {id:'ltd',  name:'Último TD del partido (manual)', yes:1, get:null}
    ]},
    {id:'WR', name:'Receptor (WR/TE)', filter:['WR','TE'], props:[
      {id:'rec',  name:'Recepciones', get:REC},
      {id:'recy', name:'Yardas por recepción', get:RECY},
      {id:'lrec', name:'Recepción más larga', get:m=>v(m,'receiving.longReception','longReception')},
      {id:'td',   name:'Anota TD', yes:1, get:TD},
      {id:'td2',  name:'2+ TD', yes:2, get:TD},
      {id:'ftd',  name:'Primer TD del partido (manual)', yes:1, get:null},
      {id:'ltd',  name:'Último TD del partido (manual)', yes:1, get:null}
    ]}
  ],
  soc: [
    {id:'JUG', name:'Jugador', filter:null, props:[
      {id:'g',   name:'Anota gol', yes:1, get:GOL},
      {id:'g2',  name:'2+ goles', yes:2, get:GOL},
      {id:'a',   name:'Asistencias', get:m=>v(m,'goalAssists')},
      {id:'ga',  name:'Gol o asistencia', yes:1, get:m=>sum(GOL(m),v(m,'goalAssists'))},
      {id:'sh',  name:'Tiros', get:m=>v(m,'totalShots')},
      {id:'sot', name:'Tiros a gol', get:m=>v(m,'shotsOnTarget')},
      {id:'fc',  name:'Faltas cometidas', get:m=>v(m,'foulsCommitted')},
      {id:'yc',  name:'Tarjeta amarilla', yes:1, get:m=>v(m,'yellowCards')},
      {id:'sv',  name:'Atajadas (portero)', get:m=>v(m,'saves')}
    ]},
    {id:'PAR', name:'Partido', team:true, filter:null, props:[
      {id:'cor',  name:'Tiros de esquina totales', get:m=>v(m,'wonCorners')},
      {id:'crd',  name:'Tarjetas totales', get:m=>sum(v(m,'yellowCards'),v(m,'redCards'))},
      {id:'sot',  name:'Tiros a gol totales', get:m=>v(m,'shotsOnTarget')},
      {id:'sh',   name:'Tiros totales', get:m=>v(m,'totalShots')},
      {id:'btts', name:'Ambos anotan', yes:1, get:m=>m._home == null ? null : (m._home > 0 && m._away > 0 ? 1 : 0)}
    ]}
  ],
  mlb: [
    {id:'BAT', name:'Bateador', filter:x=>!PITCHERS.includes(x), props:[
      {id:'h',   name:'Hits', get:BH},
      {id:'r',   name:'Carreras', get:BR},
      {id:'rbi', name:'Carreras impulsadas', get:BRBI},
      {id:'hrc', name:'Hits + carreras + impulsadas', get:m=>sum(BH(m),BR(m),BRBI(m))},
      {id:'hr',  name:'Jonrón', yes:1, get:m=>v(m,'batting.homeRuns','batting.HR')},
      {id:'bb',  name:'Bases por bola', get:m=>v(m,'batting.walks','batting.BB')},
      {id:'k',   name:'Ponches (como bateador)', get:m=>v(m,'batting.strikeouts','batting.K')},
      {id:'tb',  name:'Bases totales (manual)', get:null}
    ]},
    {id:'PIT', name:'Pitcher', filter:x=>PITCHERS.includes(x), props:[
      {id:'k',   name:'Ponches', get:m=>v(m,'pitching.strikeouts','pitching.K')},
      {id:'ha',  name:'Hits permitidos', get:m=>v(m,'pitching.hits','pitching.H')},
      {id:'er',  name:'Carreras limpias', get:m=>v(m,'pitching.earnedRuns','pitching.ER')},
      {id:'bb',  name:'Bases por bola', get:m=>v(m,'pitching.walks','pitching.BB')},
      {id:'out', name:'Outs registrados', get:OUTS}
    ]}
  ]
};
const posList = lg => POS[LEAGUES[lg].type];
const posDef = (lg, pos) => posList(lg).find(p => p.id === pos);
const propDef = (lg, pos, prop) => posDef(lg, pos)?.props.find(x => x.id === prop);
const matchPos = (f, x) => !f ? true : Array.isArray(f) ? f.includes(x) : f(x);
const isBig = d => /Yardas/.test(d.name);

// columnas de estadísticas por posición (en vivo y últimos 5)
const pair = (a, b) => a == null && b == null ? null : `${fmt(a ?? 0)}/${fmt(b ?? 0)}`;
const COLS = {
  QB:  [['C/A', m=>pair(v(m,'passing.completions','completions'), v(m,'passing.passingAttempts','passingAttempts'))], ['YDS', PY], ['TD', m=>v(m,'passing.passingTouchdowns','passingTouchdowns')], ['INT', m=>v(m,'passing.interceptions','interceptions')], ['YDS tierra', RY], ['TD tierra', m=>v(m,'rushing.rushingTouchdowns','rushingTouchdowns')]],
  RB:  [['CAR', m=>v(m,'rushing.rushingAttempts','rushingAttempts')], ['YDS', RY], ['TD', TD], ['REC', REC], ['YDS rec', RECY], ['LARGA', m=>v(m,'rushing.longRushing','longRushing')]],
  WR:  [['REC', REC], ['TGT', m=>v(m,'receiving.receivingTargets','receivingTargets')], ['YDS', RECY], ['TD', TD], ['LARGA', m=>v(m,'receiving.longReception','longReception')]],
  NBA: [['MIN', m=>v(m,'minutes','MIN')], ['PTS', PTS], ['REB', REB], ['AST', AST], ['3PM', m=>v(m,'threePointFieldGoalsMade','3PM')], ['ROB', STL], ['TAP', BLK], ['PÉR', m=>v(m,'turnovers','TO')]],
  JUG: [['G', GOL], ['A', m=>v(m,'goalAssists')], ['TIROS', m=>v(m,'totalShots')], ['A GOL', m=>v(m,'shotsOnTarget')], ['FALTAS', m=>v(m,'foulsCommitted')], ['TA', m=>v(m,'yellowCards')], ['ATAJ', m=>v(m,'saves')]],
  PAR: [['CÓRNERS', m=>v(m,'wonCorners')], ['TARJETAS', m=>sum(v(m,'yellowCards'),v(m,'redCards'))], ['TIROS', m=>v(m,'totalShots')], ['A GOL', m=>v(m,'shotsOnTarget')]],
  BAT: [['H', BH], ['C', BR], ['CI', BRBI], ['HR', m=>v(m,'batting.homeRuns','batting.HR')], ['BB', m=>v(m,'batting.walks','batting.BB')], ['K', m=>v(m,'batting.strikeouts','batting.K')]],
  PIT: [['IP', m=>v(m,'pitching.fullInnings.partInnings','pitching.innings','pitching.IP')], ['K', m=>v(m,'pitching.strikeouts','pitching.K')], ['H', m=>v(m,'pitching.hits','pitching.H')], ['CL', m=>v(m,'pitching.earnedRuns','pitching.ER')], ['BB', m=>v(m,'pitching.walks','pitching.BB')]]
};
const colsFor = (lg, pos) => LEAGUES[lg].type === 'nba' ? COLS.NBA : COLS[pos] || [];
const statLine = (cols, m) => { if (!m) return ''; const parts = cols.map(([k, f]) => { const x = f(m); return x == null ? null : `${typeof x === 'string' ? x : fmt(x)} ${k}`; }).filter(Boolean); return parts.join(' · '); };

// país y zona horaria
const COUNTRIES = [
  ['🇲🇽 México (Centro)', 'America/Mexico_City'], ['🇲🇽 México (Tijuana / Baja California)', 'America/Tijuana'],
  ['🇲🇽 México (Sonora)', 'America/Hermosillo'], ['🇲🇽 México (Sinaloa / Chihuahua / Nayarit)', 'America/Mazatlan'],

    total:kind === 'total' ? clone(g.total) : {side:null, line:null}, p:kind === 'prop' ? clone(p) : null,

const legCtx = l => ({league:l.league, eventId:l.eventId, date:l.date, home:l.home, away:l.away, manualScore:{home:0, away:0}, scoreManual:false, final:false,
  winner:l.winner, spread:l.spread || {}, total:l.total || {}, odds:{}, picks:[]});

  if (!l.eventId && l.kind !== 'prop') return {status:'pending', text:'Sin datos en vivo: márcalo con ✓ o ✗'};

const PREV = {};
let AC = null;
function beep() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(t => {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.frequency.value = 880; o.connect(gn); gn.connect(AC.destination);
      gn.gain.setValueAtTime(0.2, AC.currentTime + t);
      gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + t + 0.15);
      o.start(AC.currentTime + t); o.stop(AC.currentTime + t + 0.16);
    });
  } catch (e) {}
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4000);
}
function notify(title, body) {
  toast(title + ' — ' + body);
  if (!S.settings.alerts) return;
  beep();
  try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch (e) {}
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:'icon-192.png'})).catch(() => {});
  }
}
function checkAlerts(silent) {
  const cur = {};
  S.games.forEach(g => gameLegs(g).forEach(l => {
    const r = evalLeg(g, l.kind, l.p); if (!r) return;
    const overish = l.kind === 'prop' ? (l.p.side === 'over' && !(propDef(g.league, l.p.pos, l.p.prop) || {}).yes) : (l.kind === 'total' && g.total.side === 'over');
    cur[l.key] = {status:r.status, near:overish && r.status === 'live' && (r.pct || 0) >= 0.85, desc:legDesc(g, l.kind, l.p)};
  }));
  S.tickets.filter(t => !t.result).forEach(t => {
    const e = ticketEval(t);
    e.legs.forEach(x => { const l = x.leg; if (!l) return; const d = l.kind === 'prop' ? propDef(l.league, l.p.pos, l.p.prop) || {} : {};
      const overish = l.kind === 'prop' ? l.p.side === 'over' && !d.yes : l.kind === 'total' && l.total.side === 'over';
      cur['L' + l.id] = {status:x.status, near:overish && x.status === 'live' && (x.pct || 0) >= 0.85, desc:x.desc}; });
    cur['T' + t.id] = {status:e.status, desc:t.name, ticket:true};
  });
  if (!silent) for (const k in cur) {
    const a = cur[k], b = PREV[k]; if (!b) continue;
    if (a.ticket) {
      if (a.status !== b.status && a.status === 'won') notify('💰 Boleto ganado', a.desc);
      if (a.status !== b.status && a.status === 'lost') notify('💀 Se cayó el boleto', a.desc);
      continue;
    }
    if (a.status !== b.status && a.status === 'won') notify('✅ Pegó', a.desc);
    else if (a.status !== b.status && a.status === 'lost') notify('❌ Se cayó', a.desc);
    else if (a.near && !b.near) notify('🔥 Le falta poquito', a.desc);
  }
  Object.keys(PREV).forEach(k => delete PREV[k]);
  Object.assign(PREV, cur);
}

  const st = arr => { const ap = arr.reduce((a, t) => a + (+t.stake || 0), 0), co = arr.reduce((a, t) => a + (+t.payout || 0), 0), w = arr.filter(t => t.result === 'won').length, l = arr.filter(t => t.result === 'lost').length; return {ap, co, net:co - ap, w, l}; };
  const T = st(c);
  const by = {}; c.forEach(t => (by[tLeague(t)] = by[tLeague(t)] || []).push(t));
  return `<div class="card"><div class="kpis">
    <div class="kpi">Apostado<b>${money(T.ap)}</b></div><div class="kpi">Cobrado<b>${money(T.co)}</b></div>
    <div class="kpi">Neto<b class="${T.net >= 0 ? 'won' : 'lost'}">${T.net >= 0 ? '+' : ''}${money(T.net)}</b></div>
    <div class="kpi">Aciertos<b>${T.w + T.l ? Math.round(T.w / (T.w + T.l) * 100) : 0}% <span class="muted">(${T.w}-${T.l})</span></b></div>
  </div></div>
  <div class="card"><div class="lbl">Por liga</div><table><tr><th>Liga</th><th>G-P</th><th>Apostado</th><th>Neto</th></tr>
    ${Object.entries(by).map(([k, a]) => { const s = st(a); return `<tr><td>${esc(k)}</td><td>${s.w}-${s.l}</td><td>${money(s.ap)}</td><td class="${s.net >= 0 ? 'won' : 'lost'}">${s.net >= 0 ? '+' : ''}${money(s.net)}</td></tr>`; }).join('')}
  </table></div>
  ${c.map(ticketCard).join('')}`;
}

A.newTicket = (id, preKey) => {
  const t = id ? S.tickets.find(x => x.id === id) : null;
  const avail = [];
  S.games.forEach(g => gameLegs(g).forEach(l => avail.push({key:l.key, gid:g.id, kind:l.kind, pid:l.p?.id || null, on:l.key === preKey, odds:selOdds(g, l.kind, l.p) ?? null, desc:legDesc(g, l.kind, l.p), game:`${LEAGUES[g.league].name} · ${tName(g,'away')} @ ${tName(g,'home')}`})));
  const existing = t ? (t.legs || []).filter(l => l && typeof l === 'object').map(l => ({leg:l, on:true, odds:l.odds ?? null, desc:legDesc(legCtx(l), l.kind, l.p)})) : [];
  MOD = {type:'ticket', id:t?.id || null, name:t?.name || `Boleto ${S.tickets.length + 1}`, stake:t?.stake ?? 100, odds:t ? amTxt(t.odds) : '', touched:!!t, avail, existing};

  let lastGame = '';
  openModal(`${modalHead(t ? 'Editar boleto' : 'Nuevo boleto')}
    <input style="width:100%" value="${esc(MOD.name)}" oninput="MOD.name=this.value" placeholder="Nombre">

      <div style="flex:1"><div class="lbl">Apuesta ($)</div><input style="width:100%" type="number" inputmode="decimal" value="${esc(MOD.stake)}" oninput="MOD.stake=this.value;A.tCalc()"></div>
      <div style="flex:1"><div class="lbl">Momio total</div><input id="tOdds" style="width:100%" inputmode="text" value="${esc(MOD.odds)}" placeholder="+350 o -110" oninput="MOD.odds=this.value;MOD.touched=this.value!=='';A.tCalc()"></div>
    </div>
    <div id="tCalc" class="muted" style="margin-top:6px"></div>
    ${existing.length ? `<div class="sec"><div class="lbl">En este boleto</div>${existing.map((x, i) => row(x, i, 'existing')).join('')}</div>` : ''}

      : '<div class="muted">No tienes selecciones pendientes. En Partidos escoge ganador, handicap, total o agrega un pick.</div>'}
    </div>
    <div class="muted" style="margin-top:8px">Lo que metas al boleto se quita de Partidos. El boleto se sigue actualizando en vivo por su cuenta.</div>
    <button class="btn p full" style="margin-top:14px" onclick="A.saveTicket()">Guardar boleto</button>`);
  if (t) { const au = tAutoOdds(); MOD.touched = au == null || au !== t.odds; }
  A.tCalc();
};
const tChosen = () => [...MOD.existing.filter(x => x.on), ...MOD.avail.filter(x => x.on)];
function tAutoOdds() {
  const c = tChosen(); if (!c.length || c.some(x => x.odds == null)) return null;
  return decToAm(c.reduce((a, x) => a * amToDec(x.odds), 1));
}
A.tLeg = (list, i, on) => { MOD[list][i].on = on; A.tCalc(); };
A.tLegOdds = (list, i, val) => { MOD[list][i].odds = parseOdds(val); A.tCalc(); };
A.tCalc = () => {
  const el = $('#tCalc'); if (!el) return;
  const c = tChosen(), auto = tAutoOdds();
  if (!MOD.touched) { MOD.odds = auto != null ? amTxt(auto) : ''; const inp = $('#tOdds'); if (inp && document.activeElement !== inp) inp.value = MOD.odds; }
  const o = parseOdds(MOD.odds), st = num(MOD.stake) || 0;
  const tipo = c.length === 0 ? 'Escoge al menos una selección' : c.length === 1 ? 'Sencilla' : `Parlay de ${c.length}`;
  const calc = auto != null ? ` · calculado ${amTxt(auto)}${MOD.touched && o !== auto ? ` <a href="#" onclick="MOD.touched=false;A.tCalc();return false">usar este</a>` : ''}` : c.length ? ' · pon el momio de cada selección para calcularlo solo' : '';
  if (o == null) { el.innerHTML = `<b>${tipo}</b>${calc}`; return; }
  const dec = amToDec(o);
  el.innerHTML = `<b>${tipo}</b>${calc}<br>Decimal <b>${dec.toFixed(2)}</b> · Cobras <b>${money(st * dec)}</b> · Ganancia <b>${money(st * dec - st)}</b>`;
};
A.saveTicket = () => {
  const c = tChosen();
  if (!c.length) { toast('Escoge al menos una selección'); return; }
  const o = parseOdds(MOD.odds); if (o == null) { toast('Pon el momio total o el de cada selección'); return; }
  const legs = MOD.existing.filter(x => x.on).map(x => Object.assign(x.leg, {odds:x.odds}));
  MOD.avail.filter(x => x.on).forEach(x => {
    const g = gameById(x.gid); if (!g) return;
    const p = x.pid ? g.picks.find(q => q.id === x.pid) : null;
    legs.push(makeLeg(g, x.kind, p, x.odds));
    consumeSel(g, x.kind, p);
  });
  const data = {name:MOD.name || 'Boleto', stake:num(MOD.stake) || 0, odds:o, legs};
  if (MOD.id) Object.assign(S.tickets.find(t => t.id === MOD.id), data);
  else S.tickets.push({id:uid(), created:Date.now(), result:null, ...data});
  MOD = null; $('#modal').classList.remove('on'); UI.tab = 'tickets'; save(); refreshLive();
};
const legBy = (tid, lid) => { const t = S.tickets.find(x => x.id === tid); return t && (t.legs || []).find(l => l.id === lid); };
A.lOverride = (tid, lid, r) => { const l = legBy(tid, lid); l.override = l.override === r ? null : r; save(); };
A.lAdj = (tid, lid, k) => { const l = legBy(tid, lid); const cur = pickVal(legCtx(l), l.p).val; l.p.manual = true; l.p.cur = Math.max(0, cur + k); save(); };
A.lManual = (tid, lid) => { const l = legBy(tid, lid); l.p.cur = pickVal(legCtx(l), l.p).val; l.p.manual = true; save(); };
A.lAuto = (tid, lid) => { legBy(tid, lid).p.manual = false; save(); };
A.closeT = (id, res) => {
  const t = S.tickets.find(x => x.id === id), e = ticketEval(t);
  t.snapshot = e.legs.map(l => ({desc:l.desc, status:res === 'void' ? 'push' : l.status, text:l.text || '', league:l.league, odds:l.odds ?? null}));
  t.result = res; t.closedAt = Date.now();
  t.payout = res === 'won' ? t.stake * amToDec(t.odds) : res === 'void' ? t.stake : 0;
  toast('Guardado en tu historial'); save();
};
A.reopen = id => { const t = S.tickets.find(x => x.id === id); if (!(t.legs || []).some(l => l && typeof l === 'object')) { toast('Este boleto es de la versión anterior y no se puede reabrir'); return; } t.result = null; t.snapshot = null; t.payout = 0; save(); };
A.delTicket = id => {
  if (!confirmTap('t' + id, 'Toca otra vez 🗑 para borrar el boleto')) return;
  S.tickets = S.tickets.filter(t => t.id !== id); save();
};
A.share = id => {
  const t = S.tickets.find(x => x.id === id), e = ticketEval(t), dec = amToDec(t.odds);
  const W = 1080, P = 60, LH = 96, H = 420 + e.legs.length * LH + 260;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const fit = (s, max) => { s = String(s); while (x.measureText(s).width > max && s.length > 4) s = s.slice(0, -2); return s; };
  x.fillStyle = '#0e1117'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#171b24'; x.beginPath(); x.roundRect ? x.roundRect(30, 30, W - 60, H - 60, 36) : x.rect(30, 30, W - 60, H - 60); x.fill();
  x.fillStyle = '#3b82f6'; x.font = 'bold 34px system-ui,sans-serif'; x.fillText('🎯 MIS PICKS', P + 10, 110);
  x.fillStyle = '#e8ebf2'; x.font = 'bold 56px system-ui,sans-serif'; x.fillText(fit(t.name, W - 2 * P - 20), P + 10, 185);
  x.fillStyle = '#8a93a6'; x.font = '30px system-ui,sans-serif';
  x.fillText(`${e.legs.length === 1 ? 'Sencilla' : 'Parlay · ' + e.legs.length + ' selecciones'} · momio ${amTxt(t.odds)} (${dec.toFixed(2)})`, P + 10, 240);
  const col = {won:'#2fbf71', lost:'#ff5c5c', live:'#f2b136', pending:'#8a93a6', push:'#9aa4ff'};
  let y = 320;
  e.legs.forEach(l => {
    x.fillStyle = col[l.status] || '#8a93a6'; x.beginPath(); x.arc(P + 30, y - 12, 14, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#e8ebf2'; x.font = 'bold 34px system-ui,sans-serif'; x.fillText(fit(l.desc, W - 2 * P - 90), P + 64, y);
    x.fillStyle = '#8a93a6'; x.font = '26px system-ui,sans-serif'; x.fillText(fit(l.text || '', W - 2 * P - 90), P + 64, y + 38);
    y += LH;
  });
  y += 40;
  x.fillStyle = '#11151d'; x.fillRect(P, y, W - 2 * P, 150);
  x.fillStyle = '#8a93a6'; x.font = '28px system-ui,sans-serif'; x.fillText('Apuesta', P + 30, y + 50); x.fillText(t.result ? 'Cobrado' : 'Cobra', W / 2 + 10, y + 50);
  x.fillStyle = '#e8ebf2'; x.font = 'bold 52px system-ui,sans-serif'; x.fillText(money(t.stake), P + 30, y + 115);
  x.fillStyle = '#2fbf71'; x.fillText(money(t.result ? t.payout : t.stake * dec), W / 2 + 10, y + 115);
  c.toBlob(async b => {
    const f = new File([b], 'boleto.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[f]})) {
      try { await navigator.share({files:[f], title:t.name}); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(b);
    openModal(`${modalHead('Tu boleto')}<img src="${url}" style="width:100%;border-radius:12px"><a class="btn p full" style="display:block;text-align:center;margin-top:10px;text-decoration:none" download="boleto.png" href="${url}">⬇️ Descargar imagen</a>`);
  }, 'image/png');
};

// ajustes
A.toggleAlerts = async () => {
  S.settings.alerts = !S.settings.alerts;
  if (S.settings.alerts) {
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); await AC.resume(); } catch (e) {}
    if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) {} }
  }
  save();
};
A.testAlert = () => { const on = S.settings.alerts; S.settings.alerts = true; notify('🔔 Prueba', 'Así te van a llegar las alertas'); S.settings.alerts = on; };
A.setInterval = s => { S.settings.interval = s; save(); startTimer(); };
A.exportData = () => {
  const b = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `mispicks-${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
A.importFile = inp => {
  const f = inp.files[0]; if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt); if (!Array.isArray(d.games)) throw 0;
    S = d; S.tickets = S.tickets || []; S.settings = Object.assign({interval:30, alerts:false}, S.settings || {}); migrate();
    toast('Respaldo cargado'); save(); refreshLive(true);
  }).catch(() => toast('Ese archivo no es un respaldo válido'));
  inp.value = '';
};
A.cleanup = () => {
  if (!confirmTap('clean', 'Toca otra vez para borrar los partidos terminados')) return;
  const before = S.games.length;
  S.games = S.games.filter(g => gState(g) !== 'post');
  toast(`Se borraron ${before - S.games.length} partidos`); save();
};

// ---------- sincronización con Firebase ----------
let FB = null, USER = null, UNSUB = null, PUSH_T = null;
function initFirebase() {
  if (!firebaseConfig.apiKey || !window.firebase) return;
  try {
    firebase.initializeApp(firebaseConfig);
    FB = {auth:firebase.auth(), db:firebase.firestore()};
    FB.auth.getRedirectResult().catch(() => {});
    FB.auth.onAuthStateChanged(u => {
      USER = u;
      if (UNSUB) { UNSUB(); UNSUB = null; }
      if (u) UNSUB = FB.db.collection('picks').doc(u.uid).onSnapshot(d => {
        if (!d.exists) { pushRemote(true); return; }
        const r = d.data();
        if ((r.updatedAt || 0) > (S.updatedAt || 0)) {
          try {
            const keep = S.settings; S = JSON.parse(r.data); S.tickets = S.tickets || []; S.settings = Object.assign({}, S.settings || {}, keep, keep.tz ? {} : {tz:(JSON.parse(r.data).settings || {}).tz}); migrate();
            localStorage.setItem(KEY, JSON.stringify(S)); render(); refreshLive(); toast('🔄 Sincronizado');
          } catch (e) {}
        } else if ((r.updatedAt || 0) < (S.updatedAt || 0)) pushRemote(true);
      }, () => toast('No se pudo leer la nube'));
      render();
    });
  } catch (e) { console.warn(e); }
}
function pushRemote(now) {
  if (!FB || !USER) return;
  clearTimeout(PUSH_T);
  const go = () => FB.db.collection('picks').doc(USER.uid).set({data:JSON.stringify(S), updatedAt:S.updatedAt || Date.now()}).catch(() => toast('No se pudo sincronizar'));
  if (now) go(); else PUSH_T = setTimeout(go, 800);
}
A.login = () => {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt: 'select_account'});
  FB.auth.signInWithPopup(p).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') FB.auth.signInWithRedirect(p);
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('Error al entrar: ' + e.code);
  });
};
A.logout = () => FB.auth.signOut();

// ---------- arranque ----------
let TIMER;
function startTimer() { clearInterval(TIMER); TIMER = setInterval(() => refreshLive(), (S.settings.interval || 30) * 1000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLive(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
migrate();
initFirebase();
render();
if (!S.settings.tz) A.askCountry(true);
refreshLive();
startTimer();
</script>
